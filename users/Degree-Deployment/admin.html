<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <title>Nepal Rudraksha Lab • Admin Portal</title>

  <link
    rel="stylesheet"
    href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css"
  />

  <link
    href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;500;600;700&family=Jost:wght@300;400;500;600&family=Tangerine:wght@700&display=swap"
    rel="stylesheet"
  />

  <style>
    :root {
      --bg-main: #f5f9ff;
      --bg-card: #ffffff;
      --text-primary: #1a2c3e;
      --text-secondary: #2c4a6e;
      --blue-accent: #2c7da0;
      --blue-light: #61a5c2;
      --blue-pale: #d9edf2;
      --blue-sheen: #eff6fa;
      --gold: #c8a24c;
      --border: #cddfe7;
      --border-blue: rgba(44, 125, 160, 0.28);
      --shadow: 0 15px 30px rgba(0, 0, 0, 0.08);
    }

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: "Jost", sans-serif;
      background: linear-gradient(145deg, #dce8f2, #c2d6e8);
      min-height: 100vh;
      padding: 2rem;
    }

    .admin-container {
      max-width: 1100px;
      width: 100%;
      margin: 0 auto;
    }

    .admin-card {
      background: var(--bg-card);
      border-radius: 2rem;
      box-shadow:
        var(--shadow),
        0 0 0 1px var(--border-blue);
      padding: 2.5rem;
      animation: fadeUp 0.5s ease;
    }

    @keyframes fadeUp {
      from {
        opacity: 0;
        transform: translateY(20px);
      }

      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    .top-bar {
      display: flex;
      justify-content: flex-end;
      margin-bottom: 1.5rem;
    }

    .logout-link {
      background: var(--blue-accent);
      color: white;
      font-size: 0.9rem;
      text-decoration: none;
      font-weight: 500;
      display: inline-flex;
      align-items: center;
      gap: 0.5rem;
      padding: 0.6rem 1.2rem;
      border-radius: 30px;
      box-shadow: 0 4px 10px rgba(44, 125, 160, 0.2);
      transition: all 0.2s ease;
    }

    .logout-link:hover {
      background: #1e5a74;
      color: white;
      transform: translateY(-1px);
    }

    .brand-header {
      text-align: center;
      margin-bottom: 2.5rem;
    }

    .brand-logo {
      font-family: "Tangerine", cursive;
      font-weight: 700;
      font-size: 3.4rem;
      color: var(--blue-accent);
      text-shadow: 2px 2px 6px rgba(44, 125, 160, 0.15);
      line-height: 1.2;
    }

    .brand-sub {
      font-family: "Cormorant Garamond", serif;
      font-style: italic;
      font-size: 1rem;
      color: var(--text-secondary);
      border-top: 1px dashed var(--border-blue);
      display: inline-block;
      padding-top: 0.25rem;
      margin-top: 0.3rem;
    }

    .type-section {
      max-width: 650px;
      margin: 0 auto;
    }

    .type-title {
      text-align: center;
      color: var(--text-primary);
      font-family: "Cormorant Garamond", serif;
      font-size: 1.6rem;
      font-weight: 600;
      margin-bottom: 0.5rem;
    }

    .type-description {
      text-align: center;
      color: var(--text-secondary);
      font-size: 0.9rem;
      margin-bottom: 1.2rem;
    }

    .type-label {
      display: block;
      color: var(--text-primary);
      font-weight: 500;
      font-size: 0.9rem;
      margin-bottom: 0.4rem;
    }

    .type-label i {
      color: var(--blue-accent);
      width: 1.2rem;
    }

    .type-select {
      width: 100%;
      padding: 0.9rem 1rem;
      border: 1px solid var(--border);
      border-radius: 14px;
      font-family: "Jost", sans-serif;
      font-size: 0.95rem;
      background: var(--blue-sheen);
      color: var(--text-primary);
      cursor: pointer;
      transition: 0.2s;
    }

    .type-select:focus {
      outline: none;
      border-color: var(--blue-accent);
      box-shadow: 0 0 0 3px rgba(44, 125, 160, 0.15);
    }

    #formArea {
      display: none;
      margin-top: 2rem;
      border-top: 1px solid var(--border);
      padding-top: 2rem;
    }

    #formFrame {
      width: 100%;
      border: none;
      display: block;
      min-height: 1200px;
      border-radius: 14px;
      background: white;
    }

    .empty-message {
      margin-top: 2rem;
      padding: 2rem;
      text-align: center;
      color: var(--text-secondary);
      background: var(--blue-sheen);
      border: 1px dashed var(--border-blue);
      border-radius: 14px;
    }

    .empty-message i {
      font-size: 2rem;
      color: var(--blue-accent);
      margin-bottom: 0.7rem;
    }

    .empty-message p {
      font-size: 0.9rem;
    }

    @media (max-width: 700px) {
      body { padding: 0.7rem; }

      .admin-card {
        padding: 1rem;
        border-radius: 1.2rem;
      }

      .brand-logo { font-size: 2.8rem; }

      .brand-sub { font-size: 0.85rem; }

      .top-bar { margin-bottom: 1rem; }

      #formArea {
        margin-top: 1.2rem;
        padding-top: 1.2rem;
      }

      #formFrame { min-height: 1600px; }
    }
  </style>
</head>

<body>

  <div class="admin-container">

    <div class="admin-card">

      <!-- TOP BAR -->
      <div class="top-bar">
        <a href="/logout" class="logout-link">
          <i class="fas fa-right-from-bracket"></i>
          Logout
        </a>
      </div>

      <!-- BRAND -->
      <div class="brand-header">
        <div class="brand-logo">
          Blockchain Degree Verification
        </div>

        <div class="brand-sub">
          Certificate Deployment Portal
        </div>
      </div>

      <!-- TYPE SELECTOR -->
      <div class="type-section">

        <h2 class="type-title">
          Select Certificate Type
        </h2>

        <p class="type-description">
          Choose the certificate type you want to deploy.
        </p>

        <label class="type-label">
          <i class="fas fa-layer-group"></i>
          Certificate Type
        </label>

        <select id="certificateType" class="type-select">

          <option value="">
            — Select Certificate Type —
          </option>


          <!-- ADDED: Degree certificate option -->
          <option value="degree">
            Degree Certificate (Himalayan Institute)
          </option>

        </select>

      </div>

      <!-- EMPTY STATE -->
      <div id="emptyMessage" class="empty-message">

        <i class="fas fa-certificate"></i>

        <p>
          Please select a certificate type above to continue.
        </p>

      </div>

      <!-- FORM AREA -->
      <div id="formArea">

        <iframe
          id="formFrame"
          title="Certificate Deployment Form"
        ></iframe>

      </div>

    </div>

  </div>

  <script>

    const certificateType =
      document.getElementById("certificateType");

    const formArea =
      document.getElementById("formArea");

    const formFrame =
      document.getElementById("formFrame");

    const emptyMessage =
      document.getElementById("emptyMessage");

    // Mapping from select value to the actual HTML file
    const formMap = {
      "rudraksha-magnification": "/rudraksha-magnification.html",
      "rudraksha-xray": "/rudraksha-xray.html",
      // ADDED: Degree form mapping
      "degree": "/degree-form.html"
    };

    certificateType.addEventListener("change", function () {

      const type = this.value;
      const formUrl = formMap[type];

      if (formUrl) {

        formFrame.src = formUrl;

        formArea.style.display = "block";

        emptyMessage.style.display = "none";

      } else {

        formFrame.src = "";

        formArea.style.display = "none";

        emptyMessage.style.display = "block";

      }

    });

    /*
      Automatically resize iframe based on
      the content inside the separate form page.
    */

    window.addEventListener("message", function (event) {

      if (
        event.data &&
        event.data.type === "resize-certificate-form"
      ) {

        if (event.data.height) {

          formFrame.style.height =
            event.data.height + "px";

        }

      }

    });

  </script>

</body>
</html>
